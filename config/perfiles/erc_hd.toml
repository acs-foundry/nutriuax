# ERC en hemodiálisis. Copia exacta de v0.1 (test de regresión T19).
nombre = "ERC en hemodiálisis"
descripcion = "KDOQI 2020: 1,0-1,2 g/kg/día, 25-35 kcal/kg, sodio < 2,3 g. Potasio y fósforo según analítica (valores por defecto orientativos). El aporte de líquidos no se modela."
orden = 4
ambito = "clinico"
fuentes = [
  "Ikizler TA et al. (2020) KDOQI Clinical Practice Guideline for Nutrition in CKD: 2020 Update. Am J Kidney Dis 76(3 Suppl 1):S1-S107",
  "WHO/FAO/UNU (2007) TRS 935 (aminoácidos indispensables)",
]
proteina_gkg = [1.0, 1.2]
kcal_por_kg = 30
grasa_pct = [28, 40]
hc_pct = [40, 60]
fibra_min = 20
sodio_max = 2300
potasio_max = 2500
fosforo_max = 1000
excluir_etiquetas = ["suplemento"]

[semanal_max]
procesada = 0
alto_sodio = 1
alto_potasio = 1
