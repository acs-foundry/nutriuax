[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriuax"
version = "1.0.0"
description = "Open-source clinical nutrition engine: MILP menu optimization with BCAA & renal control, dietary surveys, food exchanges, drug-nutrient interactions, and Anything-Craft CLI/MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "NutriUAX Contributors" },
]
keywords = ["nutrition", "dietetics", "clinical-nutrition", "bcaa", "linear-programming", "mcp", "anything-craft"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "pulp>=3.0",
  "highspy>=1.7",
  "streamlit>=1.40",
  "jsonschema>=3.2",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nutriuax-cli = "nutriuax.cli:main"
nutriuax = "nutriuax.cli:launch_gui"

[project.urls]
Homepage = "https://github.com/acs-foundry/nutriuax"
Repository = "https://github.com/acs-foundry/nutriuax"

[tool.setuptools.packages.find]
where = ["src"]
